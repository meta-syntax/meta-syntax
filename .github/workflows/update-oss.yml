name: update-oss

on:
  schedule:
    # 毎時23分（毎時0分は GitHub 側が混むため避ける）
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Update README
        run: node scripts/update-oss.mjs

      # 中身が変わったときだけコミットする
      - name: Commit
        run: |
          if git diff --quiet README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'README: OSS の PR を更新'
          git push
